# Optional override. Apply AFTER compose.swarm.yml; prerequisites: docs/guide_Tayga_RU.md.
# This does not install TAYGA on the host or configure host forwarding/NAT66.
networks:
  nat46-egress:
    external: true
    name: antizapret-nat46-egress
services:
  az-local:
    image: ${NAT46_IMAGE:?Set NAT46_IMAGE to your rebuilt image tag}
    sysctls:
      net.ipv6.conf.all.forwarding: "1"
    stop_grace_period: 1m
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
    networks:
      nat46-egress: {}
    environment:
      NAT46_ENABLED: "1"
      NAT46_PREFIX: fd46:64::/96
      NAT46_IPV4_GATEWAY: ${NAT46_LOCAL_IPV4_GATEWAY:?Set local docker_gwbridge gateway}
      DOCKER_SUBNET: ${NAT46_OVERLAY_SUBNET:-10.200.0.0/24}
      IPTABLES_SAVE_DISABLED: "0"
  az-world:
    image: ${NAT46_IMAGE:?Set NAT46_IMAGE to your rebuilt image tag}
    sysctls:
      net.ipv6.conf.all.forwarding: "1"
    stop_grace_period: 1m
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
    networks:
      nat46-egress: {}
    environment:
      NAT46_ENABLED: "1"
      NAT46_PREFIX: fd46:64::/96
      NAT46_IPV4_GATEWAY: ${NAT46_WORLD_IPV4_GATEWAY:?Set world docker_gwbridge gateway}
      DOCKER_SUBNET: ${NAT46_OVERLAY_SUBNET:-10.200.0.0/24}
      IPTABLES_SAVE_DISABLED: "0"
  adguard:
    image: ${NAT46_ADGUARD_IMAGE:?Set NAT46_ADGUARD_IMAGE to your rebuilt AdGuard image tag}
    environment:
      NAT46_ENABLED: "1"
