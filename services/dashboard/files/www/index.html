<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Установка ширины под ширину экрана -->
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1"> -->
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <title>AZ</title>
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
  <div id="pageWrapper">
    <div id="tabRow">
      <div class="tab-container" id="tabContainer"></div>
      <div id="pageTitle">
        <a
                id="logout-link"
                href="#"
                target="_blank"
                class="page-title-link"
        >
          <span id="titleText">AZ</span>
          <img src="github.svg" alt="GitHub Icon" class="github-icon">
        </a>
      </div>
    </div>
    <div id="contentWrapper"></div>
    <script>
      // Портал Authelia: заменяем первый поддомен Dashboard на auth.
      const authHostname = window.location.hostname.replace(/^[^.]+\./, "auth.");
      document.getElementById("logout-link").href =
        "https://" + authHostname;
    </script>
    <script src="index.js"></script>
  </div>
  </body>
</html>
