services:
    adguard:
        cap_add:
            - NET_ADMIN
        deploy:
            mode: replicated
            replicas: 1
            restart_policy:
                condition: any
                delay: 1s
                max_attempts: 10
                window: 5s
            placement:
                constraints:
                    - node.labels.location == local
            endpoint_mode: dnsrr
        environment:
            ADGUARDHOME_PASSWORD: gE9UZyAkNEercJn5UYUOcb
            ADGUARDHOME_PORT: null
            ADGUARDHOME_USERNAME: nmisha
            ROUTES: |4
                openvpn:10.1.165.0/24;
                wireguard:10.1.166.0/24;
                wireguard-amnezia:10.1.167.0/24;
                adguard:10.224.0.1;
                az-local:10.224.0.0/15;
                az-world:10.226.0.0/15;
        hostname: adguard.antizapret
        healthcheck:
            test:
                - CMD-SHELL
                - (timeout 2m /root/healthcheck.sh || kill -TERM 1) &> /proc/1/fd/1
            timeout: 3m0s
            interval: 5s
        image: nmisha/antizapret-vpn-adguard:5.3.3
        init: true
        labels:
            homepage.description: Antizapret
            homepage.group: AntiZapret
            homepage.href: https://az.vps-nl-1.20x40.ru:1443/
            homepage.icon: adguard-home.png
            homepage.name: AdGuard
            homepage.widget.fields: '["queries", "blocked", "filtered", "latency"]'
            homepage.widget.password: gE9UZyAkNEercJn5UYUOcb
            homepage.widget.type: adguard
            homepage.widget.url: http://antizapret:3000
            homepage.widget.username: nmisha
        logging:
            driver: json-file
            options:
                max-file: "2"
                max-size: 100k
        networks:
            default: null
        sysctls:
            net.ipv4.conf.all.src_valid_mark: "1"
            net.ipv4.ip_forward: "1"
        volumes:
            - type: bind
              source: /etc/localtime
              target: /etc/localtime
              read_only: true
              bind: {}
            - type: bind
              source: /root/antizapret5.3-swarm/config/antizapret/result
              target: /root/antizapret/result
              bind: {}
            - type: bind
              source: /root/antizapret5.3-swarm/config/adguard/conf
              target: /opt/adguardhome/conf
              bind: {}
            - type: bind
              source: /root/antizapret5.3-swarm/config/adguard/work
              target: /opt/adguardhome/work
              bind: {}
    authelia:
        container_name: authelia
        deploy:
            mode: replicated
            replicas: 1
            restart_policy:
                condition: any
                delay: 1s
                max_attempts: 10
                window: 5s
            placement:
                constraints:
                    - node.labels.location == local
            endpoint_mode: dnsrr
        hostname: authelia
        image: docker.io/authelia/authelia:latest
        networks:
            default: null
        volumes:
            - type: bind
              source: /root/antizapret5.3-swarm/config-mine/authelia/config
              target: /config
              bind: {}
            - type: bind
              source: /root/antizapret5.3-swarm/config-mine/authelia/secrets/JWT_SECRET
              target: /run/secrets/JWT_SECRET
